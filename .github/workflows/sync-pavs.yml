name: Sync PAVS (Supabase -> embeddings -> Markdown)

# Desde nov-2026 la tarea programada de Claude carga las alertas nuevas directo en
# Supabase (public.upsert_pavs_alertas) y deja el embedding en NULL. Este Action:
#   1. completa los embeddings que falten (modelo local, sin API key)
#   2. regenera el Markdown mensual desde Supabase y lo commitea si cambió
# Ya no descarga nada de OneDrive (OneDrive empezó a rechazar las descargas por API).

on:
  schedule:
    # 17:00 UTC = 12:00 America/Lima (Perú no usa horario de verano)
    - cron: "0 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache del modelo de embeddings (Hugging Face)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-MiniLM-L12-v2

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: 1. Completar embeddings faltantes en Supabase
        run: python scripts/embed_missing.py

      - name: 2. Regenerar Markdown desde Supabase
        run: python scripts/export_markdown.py

      - name: Commitear el Markdown actualizado
        run: |
          git config user.name "pavs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/md
          if git diff --cached --quiet; then
            echo "Sin cambios en data/md."
          else
            git commit -m "PAVS: actualiza Markdown ($(date -u +%Y-%m-%d))"
            git push
          fi
