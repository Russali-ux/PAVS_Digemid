name: Sync PAVS (OneDrive -> repo -> Supabase)

on:
  schedule:
    # 11:00 UTC = 06:00 America/Lima (Perú no usa horario de verano)
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone (OneDrive)
        env:
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Cache del modelo de embeddings (Hugging Face)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-MiniLM-L12-v2

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: 0. Traer xlsx nuevos de OneDrive
        run: python scripts/0_fetch_from_onedrive.py

      - name: 1. Convertir xlsx -> csv/json
        run: python scripts/1_convert_xlsx.py

      - name: 2. Generar embeddings (local, sin API key)
        run: python scripts/2_generate_embeddings.py

      - name: 3. Sincronizar con Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/3_sync_to_supabase.py

      - name: Commitear los xlsx nuevos (Raw data)
        run: |
          git config user.name "pavs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "Sin archivos nuevos que commitear."
          else
            git commit -m "chore: sync PAVS xlsx desde OneDrive ($(date -u +%Y-%m-%d))"
            git push
          fi
